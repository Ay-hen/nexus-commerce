<main class="error-page">
  <div class="error-page__inner">
    <!-- Main illustration with animated overlays -->
    <div class="error-page__illustration-container">
      <img
        src="/illustrations/404-lost-character.png"
        alt="Lost shopping bag character confused about a missing page"
        class="error-page__illustration"
        loading="lazy"
      />

      <!-- Animated compass (searching) -->
      <div class="error-page__compass" aria-hidden="true">
        <svg
          class="error-page__compass-icon"
          width="64"
          height="64"
          viewBox="0 0 64 64"
          xmlns="http://www.w3.org/2000/svg"
        >
          <circle cx="32" cy="32" r="26" class="error-page__compass-outer" />
          <!-- Compass needle -->
          <g class="error-page__compass-needle">
            <path d="M 32 8 L 34 26 L 32 32 L 30 26 Z" class="error-page__compass-needle-upper" />
            <path d="M 32 32 L 34 38 L 32 56 L 30 38 Z" class="error-page__compass-needle-lower" />
          </g>
          <!-- Cardinal marks -->
          <text x="32" y="16" class="error-page__compass-mark" text-anchor="middle">N</text>
          <text x="48" y="36" class="error-page__compass-mark" text-anchor="start">E</text>
        </svg>
      </div>

      <!-- Animated question mark (emphasis) -->
      <div class="error-page__question-mark" aria-hidden="true">
        <span class="error-page__question-char">?</span>
      </div>
    </div>

    @if (entry.statusCode) {
      <p class="error-page__code" aria-hidden="true">{{ entry.statusCode }}</p>
    }

    <h1 class="error-page__title" tabindex="-1" #heading>
      {{ entry.i18nPrefix + '.title' | translate }}
    </h1>

    <p class="error-page__message">
      {{ entry.i18nPrefix + '.message' | translate }}
    </p>

    <div class="error-page__actions">
      <button
        type="button"
        class="error-page__btn error-page__btn--primary"
        (click)="handleAction(entry.primaryAction)"
      >
        {{ entry.primaryAction.labelKey | translate }}
      </button>

      @if (entry.secondaryAction; as secondary) {
        <button
          type="button"
          class="error-page__btn error-page__btn--secondary"
          (click)="handleAction(secondary)"
        >
          {{ secondary.labelKey | translate }}
        </button>
      }
    </div>
  </div>
</main>
