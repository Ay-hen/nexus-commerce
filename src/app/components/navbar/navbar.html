<div class="navbar">
  <div class="logo">
    <img src="favicon.png" alt="logo">
    <h2>Nexus</h2>
  </div>

  <ul class="nav-links">
    <li routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      <a routerLink="/home">Home</a>
    </li>

    <li routerLinkActive="active">
      <a routerLink="/categories">Categories</a>
    </li>

    <li routerLinkActive="active">
      <a routerLink="/products">Products</a>
    </li>

    <li routerLinkActive="active">
      <a routerLink="/contact">Contact</a>
    </li>
  </ul>

  <div class="right-nav">

    @if (auth.isLoggedIn()) {

      <!-- favorite products -->
      <div class="icon" (click)="toFavorites()" title="Favorites">
        @if (data.favCount() > 0) {
          <span class="badge">{{ data.favCount() }}</span>
        }
        <img class="icon-img" [class.heart-bounce]="data.favCount() > 0" [src]="icons.like" alt="Favorites" />
      </div>

      <!-- Cart -->
      <div class="icon">
        @if (data.cartCount() > 0) {
          <span class="badge">{{ data.cartCount() }}</span>
        }
        <img class="icon-img" (click)="toCart()" [src]="icons.shopping" alt="shopping" />
      </div>

      <!-- Notification -->
      <app-notification></app-notification>

      <!-- Account menu -->
      <div class="account-menu">
        <button
          class="avatar-btn"
          type="button"
          (click)="toggleMenu($event)"
          [attr.aria-expanded]="menuOpen()"
          aria-haspopup="menu"
          aria-label="Account menu"
        >
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </button>

        @if (menuOpen()) {
          <div class="account-dropdown" role="menu" (click)="$event.stopPropagation()">
            @if (auth.currentUser(); as user) {
              <div class="account-dropdown__header">
                <p class="account-dropdown__name">{{ user.name }}</p>
                <p class="account-dropdown__email">{{ user.email }}</p>
              </div>
            }
            <button class="account-dropdown__item" type="button" role="menuitem" (click)="toSettings()">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
              </svg>
              Account settings
            </button>
            <div class="account-dropdown__divider"></div>
            <button class="account-dropdown__item account-dropdown__item--danger" type="button" role="menuitem" (click)="signOut()">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                <polyline points="16 17 21 12 16 7"/>
                <line x1="21" y1="12" x2="9" y2="12"/>
              </svg>
              Log out
            </button>
          </div>
        }
      </div>

    } @else {

      <!-- Sign In -->
      <button class="sign-in-btn" (click)="signIn()">Sign In</button>

    }
  </div>
</div>
