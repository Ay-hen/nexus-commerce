<!-- ══════════════════ NOTIFICATION CHANNELS ══════════════════ -->
<div class="settings-card">
  <div class="settings-card__head">
    <h2 class="settings-card__title">{{ 'settings.notifications.channelsTitle' | translate }}</h2>
    <p class="settings-card__sub">{{ 'settings.notifications.channelsSub' | translate }}</p>
  </div>
  <div class="toggle-list">
    <label class="toggle-row">
      <span class="toggle-row__text"><span class="toggle-row__title">{{ 'settings.notifications.email' | translate }}</span><span class="toggle-row__sub">{{ 'settings.notifications.emailSub' | translate }}</span></span>
      <span class="switch"><input type="checkbox" [checked]="settings.emailNotifications" (change)="update('emailNotifications', $any($event.target).checked)" /><span class="switch__track"><span class="switch__thumb"></span></span></span>
    </label>
    <label class="toggle-row">
      <span class="toggle-row__text"><span class="toggle-row__title">{{ 'settings.notifications.push' | translate }}</span><span class="toggle-row__sub">{{ 'settings.notifications.pushSub' | translate }}</span></span>
      <span class="switch"><input type="checkbox" [checked]="settings.pushNotifications" (change)="update('pushNotifications', $any($event.target).checked)" /><span class="switch__track"><span class="switch__thumb"></span></span></span>
    </label>
    <label class="toggle-row">
      <span class="toggle-row__text"><span class="toggle-row__title">{{ 'settings.notifications.sms' | translate }}</span><span class="toggle-row__sub">{{ 'settings.notifications.smsSub' | translate }}</span></span>
      <span class="switch"><input type="checkbox" [checked]="settings.smsNotifications" (change)="update('smsNotifications', $any($event.target).checked)" /><span class="switch__track"><span class="switch__thumb"></span></span></span>
    </label>
  </div>
</div>
